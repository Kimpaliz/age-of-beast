name: Wiki-Qualitätssicherung

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quelltext auf Syntax prüfen
        run: |
          # Alle lokalen Browser-Dateien werden als temporäre ES-Module
          # geprüft. Neue Runtime- oder Kontextmodule können so nicht still
          # an der Syntaxprüfung vorbeigehen.
          anzahl=0
          while IFS= read -r -d '' datei; do
            ziel="$RUNNER_TEMP/browser-modulsyntax/${datei#./}"
            ziel="${ziel%.js}.mjs"
            mkdir -p "$(dirname "$ziel")"
            cp "$datei" "$ziel"
            node --check "$ziel"
            anzahl=$((anzahl + 1))
          done < <(find . \( -path './.git' -o -path '*/node_modules' \) -prune -o -type f -name '*.js' -print0 | LC_ALL=C sort -z)
          test "$anzahl" -gt 0
          echo "Browser-JavaScript-Dateien: $anzahl"
          for datei in werkzeuge/*.mjs; do node --check "$datei"; done

      - name: Daten und alle lokalen Prüfer ausführen
        run: |
          node -e "JSON.parse(require('fs').readFileSync('daten/quelle.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('daten/welt.json','utf8'))"
          test -f daten/welt.js
          node -e "JSON.parse(require('fs').readFileSync('daten/rahmen-felder.json','utf8'))"
          anzahl=0
          while IFS= read -r datei; do
            node "$datei"
            anzahl=$((anzahl + 1))
          done < <(find werkzeuge -maxdepth 1 -type f -name 'pruefe-*.mjs' -print | LC_ALL=C sort)
          test "$anzahl" -gt 0
          echo "Lokale Wächter: $anzahl"

      - name: Browser-Artefakt versionieren und vollständig prüfen
        run: |
          ARTEFAKT="$RUNNER_TEMP/wiki-artefakt"
          mkdir -p "$ARTEFAKT"
          git archive --format=tar HEAD | tar -x -C "$ARTEFAKT"
          KENN="${GITHUB_SHA:0:8}"
          node werkzeuge/versioniere-browser-ressourcen.mjs --artefakt "$ARTEFAKT" --version "$KENN"
          node werkzeuge/pruefe-cache-graph.mjs --quelle . --artefakt "$ARTEFAKT" --version "$KENN"
