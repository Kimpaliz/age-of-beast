# Veröffentlicht das Wiki auf GitHub Pages.
#
# Es gibt keinen Übersetzungsschritt: Der Ordner wird so hochgeladen, wie er
# im Repository liegt. Läuft bei jedem Push auf `main` und lässt sich auf der
# Actions-Seite auch von Hand starten.
#
# Einmalige Einrichtung auf GitHub:
#   Settings -> Pages -> Source: "GitHub Actions"

name: Wiki veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft eine Veröffentlichung bereits, wird sie nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.bereitstellen.outputs.page_url }}
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quelltext auf Tippfehler prüfen
        run: |
          node --check wiki.js
          # Die Browser-Module sind ES-Module mit .js-Endung. Node
          # erkennt das nur an der Endung, deshalb der Umweg über eine Kopie.
          for datei in bearbeiten.js texte-bearbeiten.js struktur-bedienung.js rahmen-assistent.js; do
            cp "$datei" "$RUNNER_TEMP/${datei%.js}.mjs"
            node --check "$RUNNER_TEMP/${datei%.js}.mjs"
          done
          for datei in werkzeuge/*.mjs; do node --check "$datei"; done

      - name: Prüfen, ob die Weltdaten gültig sind
        run: |
          node -e "JSON.parse(require('fs').readFileSync('daten/quelle.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('daten/welt.json','utf8'))"
          test -f daten/welt.js
          # Der Assistent braucht die Feldbeschreibung.
          node -e "JSON.parse(require('fs').readFileSync('daten/rahmen-felder.json','utf8'))"
          # Die angezeigte Kopie muss zur Quelle passen. Speichert das Wiki
          # selbst, legt es beide zusammen in einen Commit – schlägt das hier
          # fehl, sind sie auseinandergelaufen.
          node werkzeuge/pruefe-gleichstand.mjs

      - name: Prüfen, dass Bearbeiten keinen Text beschädigt
        run: |
          # Öffnen und unverändertes Speichern muss jeden Text so lassen,
          # wie er war. Diese beiden Prüfungen sind die Sicherheitsleine
          # unter dem Bearbeitungsmodus.
          node werkzeuge/pruefe-schreibweise.mjs
          node werkzeuge/pruefe-bearbeiten.mjs
          # Anlegen, Löschen und Umsortieren an allen Roh-Einträgen.
          node werkzeuge/pruefe-struktur.mjs
          # Und der Browser muss beim Speichern dieselben Dateien erzeugen
          # wie das Skript auf der Festplatte.
          node werkzeuge/pruefe-github.mjs
          # Die beiden reinen Lese-Server dürfen nur veröffentlichte Dateien
          # ausliefern und die Vorschau bleibt auf Loopback beschränkt.
          node werkzeuge/pruefe-server-sicherheit.mjs
          # Der Cache-Graph wird mit echten und absichtlich kaputten
          # Abhängigkeiten geprüft. Die Quelle bleibt dabei unverändert.
          node werkzeuge/pruefe-cache-graph.mjs

      - name: Pages-Artefakt versionieren und vollständig prüfen
        run: |
          # GitHub Pages lässt Browser-Dateien im Zwischenspeicher. Ein
          # Kennzeichen aus dem Commit macht jede veränderliche Abhängigkeit
          # zu einer eigenen Adresse. Nicht die Quelle, sondern ausschließlich
          # diese neu erzeugte und danach geprüfte Kopie wird hochgeladen.
          ARTEFAKT="$RUNNER_TEMP/pages-artefakt"
          mkdir -p "$ARTEFAKT"
          git archive --format=tar HEAD | tar -x -C "$ARTEFAKT"
          KENN="${GITHUB_SHA:0:8}"
          node werkzeuge/versioniere-browser-ressourcen.mjs --artefakt "$ARTEFAKT" --version "$KENN"
          node werkzeuge/pruefe-cache-graph.mjs --quelle . --artefakt "$ARTEFAKT" --version "$KENN"

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-artefakt

      - name: Bereitstellen
        id: bereitstellen
        uses: actions/deploy-pages@v4
